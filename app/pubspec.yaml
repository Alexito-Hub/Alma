name: alma
description: "Alma — a private, immersive space for two."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local DB (offline-first cache) — maintained community fork of Isar 3
  # (declares namespace + modern compileSdk, so it builds cleanly on AGP 8).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5

  # Networking
  dio: ^5.7.0
  phoenix_socket: ^0.7.6

  # Auth
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.2.2

  # Background sync
  workmanager: ^0.9.0
  connectivity_plus: ^6.1.0

  # Media handling (visually-lossless compression policy)
  image_picker: ^1.1.2
  image: ^4.3.0           # JPEG re-encoding, EXIF strip
  video_compress: ^3.1.3  # H.264 high-quality presets
  flutter_image_compress: ^2.3.0

  # UI helpers
  cached_network_image: ^3.4.1
  intl: ^0.20.0
  uuid: ^4.5.1
  table_calendar: ^3.1.2

  # Native media / device (Diary 2.0)
  image_cropper: 12.2.1        # crop on upload; square for avatars
  video_player: ^2.9.2         # short-video playback
  geolocator: ^13.0.2          # entry geotag
  geocoding: ^3.0.0            # reverse-geocode to a place label
  flutter_local_notifications: ^22.2.0
  home_widget: ^0.9.3
  # Voice notes. Pinned to the last releases that still support Flutter
  # 3.38: record 7.x needs Flutter >=3.44, audioplayers 6.8 likewise.
  record: 6.2.1
  just_audio: 0.10.6
  get_thumbnail_video: 0.7.3
  share_plus: 12.0.2

  # Accelerometer, for the shake that opens the capsule in the birthday
  # sequence. Nothing else in the app reads sensors.
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logotype/

# App icon for all launchers — regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logotype/alma.png"
  adaptive_icon_background: "#FCEFDA"
  adaptive_icon_foreground: "assets/images/logotype/alma.png"
  min_sdk_android: 23

# Launch/splash screen — regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FCEFDA"
  image: "assets/images/logotype/alma.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#FCEFDA"
    image: "assets/images/logotype/alma.png"
